          mark: function (reason) {
            try { sessionStorage.setItem(this.KEY, String(Date.now())); } catch (_) {}

          clear: function () {
            try { sessionStorage.removeItem(this.KEY); } catch (_) {}
            trace('reload-guard-clear');

        const start = () => {
          if (started) return;
          started = true;
          trace('progress-start');

          let removed = false;
          const bar = document.getElementById('progress-bar');
          const pct = document.getElementById('progress-pct');
          const startTime = performance.now();

          const removeSpinner = () => {
            if (removed) return;
            removed = true;
            trace('spinner-removed');
            if (bar) bar.style.width = '100%';
            if (pct) pct.textContent = '100%';
            const spinner = document.querySelector('.loading-spinner');
            if (spinner) {

              setTimeout(() => spinner.remove(), 300);
            }
          };

          // Remove cube when React has mounted route UI. Keep this intentionally
          // permissive so mobile/preview wrappers never get parked at 97%.
          const hasVisibleContent = () => {
            const root = document.getElementById('root');
            if (!root) return false;
            if (!root.children.length) return false;
            var rect = root.getBoundingClientRect();
            var text = (root.textContent || '').replace(/\s+/g, ' ').trim();
            var hasPageSignal = !!root.querySelector('header, main, nav, section, article, h1, h2, button, a, input');
            return (rect.height > 40 || root.scrollHeight > 40) && (text.length > 12 || hasPageSignal);
          };

          // RAF-based percentage counter (syncs with 8s CSS progressGrow timing)
          const updatePct = () => {
            if (removed) return;
            var elapsed = performance.now() - startTime;
            var duration = 3500;
            var t = Math.min(elapsed / duration, 1);
            var p;
            if (t < 0.15) p = 5 + (35 * (t / 0.15));
            else if (t < 0.35) p = 40 + (25 * ((t - 0.15) / 0.20));
            else if (t < 0.55) p = 65 + (15 * ((t - 0.35) / 0.20));
            else if (t < 0.75) p = 80 + (10 * ((t - 0.55) / 0.20));

            // long CSS animations in the background (iOS Safari throttles).

            if (sec) {

              sec.textContent = s + 's';
            }
            requestAnimationFrame(updatePct);
          };

          }, { once: true });

          var contentCheck = setInterval(function() {

            }
          }, 100);

          // Watchdog: never let the Matrix cube trap visitors at 97%.
          // In dev/preview, HMR or a stale chunk can fail before React dispatches
          // route-ready; after one clean reload, reveal a recovery panel instead
          // of leaving a blocking loading screen over the site.
          setTimeout(function() {

              var root = document.getElementById('root');
              var rootText = root ? (root.textContent || '').replace(/\s+/g, ' ').trim() : '';
              if (root && root.children.length && (rootText.length > 0 || root.querySelector('header, main, nav, section, article, h1, h2, button, a, input'))) {

              }
              removeSpinner();
            }
          }, 9000);
        };

        const tryStart = () => {
          if (started) return;
          if (document.getElementById('progress-bar') && document.getElementById('progress-pct')) {
            start();
            return;
          }
          requestAnimationFrame(tryStart);
        };

        tryStart();
      })();
