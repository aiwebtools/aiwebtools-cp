    <!-- Critical CSS for instant first paint - Matrix Loading -->
    <style>
      body { margin: 0; background: #030712; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; background: #030712; }
      .loading-spinner { 
        position: fixed;
        inset: 0;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        background: radial-gradient(ellipse at center, #0a1628 0%, #030712 70%);
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s ease-out;
        overflow: hidden;
      }
      .loading-spinner.fade-out { opacity: 0; pointer-events: none; }
      
      /* Matrix rain background */
      .matrix-bg { position: absolute; inset: 0; opacity: 0.15; overflow: hidden; }
      .matrix-col { position: absolute; top: -100%; font: 10px monospace; color: #00ff41; writing-mode: vertical-rl; animation: fall linear infinite; text-shadow: 0 0 8px #00ff41; }
      @keyframes fall { 0% { transform: translateY(0); } 100% { transform: translateY(250vh); } }
      
      .loading-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      
      /* Rotating cube */
      .cube-container { perspective: 200px; width: 50px; height: 50px; margin-bottom: 10px; }
      .cube {
        width: 50px; height: 50px;
        position: relative;
        transform-style: preserve-3d;
        animation: rotateCube 3s linear infinite;
      }
      .cube-face {
        position: absolute;
        width: 50px; height: 50px;
        border: 2px solid #00ff41;
        background: rgba(0, 255, 65, 0.1);
        box-shadow: 0 0 15px rgba(0, 255, 65, 0.3), inset 0 0 15px rgba(0, 255, 65, 0.1);
        display: flex; align-items: center; justify-content: center;
        font: bold 16px monospace; color: #00ff41;
      }
      .cube-face.front { transform: translateZ(25px); }
      .cube-face.back { transform: rotateY(180deg) translateZ(25px); }
      .cube-face.right { transform: rotateY(90deg) translateZ(25px); }
      .cube-face.left { transform: rotateY(-90deg) translateZ(25px); }
      .cube-face.top { transform: rotateX(90deg) translateZ(25px); }
      .cube-face.bottom { transform: rotateX(-90deg) translateZ(25px); }
      @keyframes rotateCube { 
        0% { transform: rotateX(0deg) rotateY(0deg); }
        100% { transform: rotateX(360deg) rotateY(360deg); }
      }
      
      /* Glitch text */
      .glitch-text {
        font: bold 22px 'Courier New', monospace;
        color: #00ff41;
        letter-spacing: 4px;
        text-shadow: 0 0 20px #00ff41;
        position: relative;
        animation: glitch 0.5s infinite;
      }
      .glitch-text::before, .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
      }
      .glitch-text::before {
        color: #ff00ff;
        animation: glitchLeft 0.3s infinite;
        clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
      }
      .glitch-text::after {
        color: #00ffff;
        animation: glitchRight 0.3s infinite;
        clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
      }
      @keyframes glitch {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-2px, 1px); }
        40% { transform: translate(2px, -1px); }
        60% { transform: translate(-1px, 2px); }
        80% { transform: translate(1px, -2px); }
      }
      @keyframes glitchLeft {
        0%, 100% { transform: translate(0); }
        50% { transform: translate(-3px, 0); }
      }
      @keyframes glitchRight {
        0%, 100% { transform: translate(0); }
        50% { transform: translate(3px, 0); }
      }
      
      /* Tagline with typing effect */
      .tagline {
        font: 12px 'Courier New', monospace;
        color: #22d3ee;
        letter-spacing: 2px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      
      /* Progress bar - always moving */
      .progress-wrap {
        width: 200px;
        height: 4px;
        background: rgba(0, 255, 65, 0.2);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }
      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #00ff41, #22d3ee, #a855f7, #00ff41);
        background-size: 300% 100%;
        border-radius: 4px;
        animation: progressShimmer 1.5s linear infinite;
        transition: width 0.1s ease-out;
      }
      @keyframes progressShimmer {
        0% { background-position: 100% 0; }
        100% { background-position: 0% 0; }
      }
      .progress-text {
        font: 10px 'Courier New', monospace;
        color: #00ff41;
        margin-top: 8px;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink { 50% { opacity: 0.5; } }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        let removed = false;
        const bar = document.getElementById('progress-bar');
        const pct = document.getElementById('progress-pct');
        
        const removeSpinner = () => {
          if (removed) return;
          removed = true;
          const spinner = document.querySelector('.loading-spinner');
          if (spinner) {
            spinner.classList.add('fade-out');
            setTimeout(() => spinner.remove(), 300);
          }
        };
        
        // Check for REAL visible content
        const hasVisibleContent = () => {
          const root = document.getElementById('root');
          if (!root) return false;
          
          const children = root.children;
          let hasRealContent = false;
          
          for (let i = 0; i < children.length; i++) {
            const child = children[i];
            if (child.classList.contains('loading-spinner')) continue;
            if (child.offsetHeight > 50) {
              hasRealContent = true;
              break;
            }
          }
          
          const header = document.querySelector('header');
          const mainContent = document.querySelector('main');
          const disclaimerGate = document.querySelector('[class*="disclaimer"], [class*="Disclaimer"], [class*="welcome"]');
          
          return hasRealContent && (header || mainContent || disclaimerGate);
        };

        // Smooth progress animation - always moving until done
        let width = 5;
        const tick = () => {
          if (removed) return; // Stop if already removed
          width = Math.min(width + (Math.random() * 1.2 + 0.4), 92);
          if (bar) bar.style.width = width + '%';
          if (pct) pct.textContent = Math.round(width) + '%';
        };
        
        const progressInterval = setInterval(tick, 80);
        tick(); // Start immediately

        // Check for VISIBLE content
        const contentCheck = setInterval(() => {
          if (hasVisibleContent()) {
            clearInterval(contentCheck);
            // Animate to 100% smoothly before removing
            const finishProgress = setInterval(() => {
              width = Math.min(width + 4, 100);
              if (bar) bar.style.width = width + '%';
              if (pct) pct.textContent = Math.round(width) + '%';
              if (width >= 100) {
                clearInterval(finishProgress);
                clearInterval(progressInterval);
                setTimeout(removeSpinner, 150);
              }
            }, 20);
          }
        }, 50);

        // Fallback
        setTimeout(() => {
          if (removed) return;
          clearInterval(contentCheck);
          clearInterval(progressInterval);
          if (bar) bar.style.width = '100%';
          if (pct) pct.textContent = '100%';
          removeSpinner();
        }, 6000);
      });
    </script>
