    <style>
      body { margin: 0; background: #030712; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; background: #030712; }
      .loading-spinner { 
        position: fixed;
        inset: 0;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        background: #030712;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.25s ease-out;
      }
      .loading-spinner.fade-out { 
        opacity: 0;
        pointer-events: none;
      }
      .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: pulseGlow 1.5s ease-in-out infinite;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      .loading-logo {
        font-family: 'Courier New', monospace;
        font-size: 20px;
        font-weight: bold;
        color: #22d3ee;
        letter-spacing: 4px;
        text-shadow: 0 0 30px rgba(34, 211, 238, 0.6);
      }
      .loading-tagline {
        font-family: 'Courier New', monospace;
        font-size: 13px;
        color: #00ff41;
        letter-spacing: 1px;
        text-shadow: 0 0 10px #00ff41;
      }
      .progress-container {
        width: 220px;
        height: 3px;
        background: rgba(34, 211, 238, 0.2);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 12px;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #22d3ee, #a855f7, #22d3ee);
        background-size: 200% 100%;
        border-radius: 2px;
        animation: shimmer 1s linear infinite;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
    <script>
      (function() {
        let removed = false;
        
        const removeSpinner = () => {
          if (removed) return;
          removed = true;
          const spinner = document.querySelector('.loading-spinner');
          if (spinner) {
            spinner.classList.add('fade-out');
            setTimeout(() => spinner.remove(), 250);
          }
        };
        
        // Check if any real content is visible (not just empty containers)
        const hasVisibleContent = () => {
          // Look for actual rendered content elements
          const header = document.querySelector('header');
          const heroSection = document.querySelector('[class*="hero"], [class*="Hero"]');
          const mainContent = document.querySelector('main, [class*="min-h-screen"]:not(.loading-spinner)');
          const disclaimerGate = document.querySelector('[class*="bg-gray-900"]'); // Disclaimer modal
          
          return !!(header || heroSection || mainContent || disclaimerGate);
        };

        // Progress bar animation
        const bar = document.getElementById('progress-bar');
        let width = 0;
        const progressInterval = setInterval(() => {
          width = Math.min(width + 2, 95);
          if (bar) bar.style.width = width + '%';
        }, 20);

        // Wait for actual visible content before removing
        const contentCheck = setInterval(() => {
          if (hasVisibleContent()) {
            clearInterval(contentCheck);
            clearInterval(progressInterval);
            if (bar) bar.style.width = '100%';
            setTimeout(removeSpinner, 100);
          }
        }, 50);

        // Fallback - remove after 1.5s max to prevent stuck loading
        setTimeout(() => {
          clearInterval(contentCheck);
          clearInterval(progressInterval);
          if (bar) bar.style.width = '100%';
          removeSpinner();
        }, 1500);
      })();
    </script>
