      /* Rotating cube - MAXIMUM cross-browser GPU acceleration */
      .cube-container { 
        -webkit-perspective: 200px;
        perspective: 200px; 
        width: 50px; 
        height: 50px; 
        margin-bottom: 10px;
        /* Force GPU compositing layer */
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        -webkit-transform-style: preserve-3d;
        transform-style: preserve-3d;
      }
      .cube {
        width: 50px; 
        height: 50px;
        position: relative;
        -webkit-transform-style: preserve-3d;
        transform-style: preserve-3d;
        -webkit-animation: rotateCube 1.2s linear infinite;
        animation: rotateCube 1.2s linear infinite;
        /* Critical: will-change hints browser to GPU accelerate */
        will-change: transform;
        -webkit-backface-visibility: visible;
        backface-visibility: visible;
        -webkit-transform-origin: center center;
        transform-origin: center center;
        /* Force hardware acceleration on mobile */
        -webkit-transform: translateZ(0) rotateX(0deg) rotateY(0deg);
        transform: translateZ(0) rotateX(0deg) rotateY(0deg);
      }
      .cube-face {
        position: absolute;
        width: 50px; 
        height: 50px;
        border: 2px solid #00ff41;
        background: rgba(0, 255, 65, 0.1);
        box-shadow: 0 0 15px rgba(0, 255, 65, 0.3), inset 0 0 15px rgba(0, 255, 65, 0.1);
        display: flex; 
        align-items: center; 
        justify-content: center;
        font: bold 16px monospace; 
        color: #00ff41;
        -webkit-backface-visibility: visible;
        backface-visibility: visible;
        /* GPU accelerate each face */
        -webkit-transform-style: preserve-3d;
        transform-style: preserve-3d;
      }
      .cube-face.front { -webkit-transform: translateZ(25px); transform: translateZ(25px); }
      .cube-face.back { -webkit-transform: rotateY(180deg) translateZ(25px); transform: rotateY(180deg) translateZ(25px); }
      .cube-face.right { -webkit-transform: rotateY(90deg) translateZ(25px); transform: rotateY(90deg) translateZ(25px); }
      .cube-face.left { -webkit-transform: rotateY(-90deg) translateZ(25px); transform: rotateY(-90deg) translateZ(25px); }
      .cube-face.top { -webkit-transform: rotateX(90deg) translateZ(25px); transform: rotateX(90deg) translateZ(25px); }
      .cube-face.bottom { -webkit-transform: rotateX(-90deg) translateZ(25px); transform: rotateX(-90deg) translateZ(25px); }
      
      /* Cube rotation - with webkit prefix for Safari/iOS */
      @-webkit-keyframes rotateCube { 
        from { -webkit-transform: rotateX(0deg) rotateY(0deg); transform: rotateX(0deg) rotateY(0deg); }
        to { -webkit-transform: rotateX(360deg) rotateY(360deg); transform: rotateX(360deg) rotateY(360deg); }
      }
      @keyframes rotateCube { 
        from { transform: rotateX(0deg) rotateY(0deg); }
        to { transform: rotateX(360deg) rotateY(360deg); }
      }
      
      /* Glitch text */
      .glitch-text {
        font: bold 22px 'Courier New', monospace;
        color: #00ff41;
        letter-spacing: 4px;
        text-shadow: 0 0 20px #00ff41;
        position: relative;
        -webkit-animation: glitch 0.5s infinite;
        animation: glitch 0.5s infinite;
      }
      .glitch-text::before, .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
      }
      .glitch-text::before {
        color: #ff00ff;
        -webkit-animation: glitchLeft 0.3s infinite;
        animation: glitchLeft 0.3s infinite;
        -webkit-clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
      }
      .glitch-text::after {
        color: #00ffff;
        -webkit-animation: glitchRight 0.3s infinite;
        animation: glitchRight 0.3s infinite;
        -webkit-clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
      }
      @-webkit-keyframes glitch {
        0%, 100% { -webkit-transform: translate(0); transform: translate(0); }
        20% { -webkit-transform: translate(-2px, 1px); transform: translate(-2px, 1px); }
        40% { -webkit-transform: translate(2px, -1px); transform: translate(2px, -1px); }
        60% { -webkit-transform: translate(-1px, 2px); transform: translate(-1px, 2px); }
        80% { -webkit-transform: translate(1px, -2px); transform: translate(1px, -2px); }
      }
      @keyframes glitch {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-2px, 1px); }
        40% { transform: translate(2px, -1px); }
        60% { transform: translate(-1px, 2px); }
        80% { transform: translate(1px, -2px); }
      }
      @-webkit-keyframes glitchLeft {
        0%, 100% { -webkit-transform: translate(0); transform: translate(0); }
        50% { -webkit-transform: translate(-3px, 0); transform: translate(-3px, 0); }
      }
      @keyframes glitchLeft {
        0%, 100% { transform: translate(0); }
        50% { transform: translate(-3px, 0); }
      }
      @-webkit-keyframes glitchRight {
        0%, 100% { -webkit-transform: translate(0); transform: translate(0); }
        50% { -webkit-transform: translate(3px, 0); transform: translate(3px, 0); }
      }
      @keyframes glitchRight {
        0%, 100% { transform: translate(0); }
        50% { transform: translate(3px, 0); }
      }
      
      /* Tagline with typing effect */
      .tagline {
        font: 12px 'Courier New', monospace;

        -webkit-animation: pulse 1.5s ease-in-out infinite;

      @-webkit-keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      
      /* Progress bar - pure CSS animation, never freezes on mobile */
      .progress-wrap {
        width: 200px;
        height: 4px;
        background: rgba(0, 255, 65, 0.2);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
      }
      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #00ff41, #22d3ee, #a855f7, #00ff41);
        background-size: 300% 100%;
        border-radius: 4px;
        /* Slowed to 8s so bar creeps toward 97% while React boots — no premature 100%. */
        width: 5%;
        -webkit-animation: progressShimmer 1.5s linear infinite, progressGrow 8s ease-out forwards;
        animation: progressShimmer 1.5s linear infinite, progressGrow 8s ease-out forwards;
        will-change: width, background-position;
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
      }
      @-webkit-keyframes progressShimmer {
        0% { background-position: 100% 0; }
        100% { background-position: 0% 0; }
      }
      @keyframes progressShimmer {
        0% { background-position: 100% 0; }
        100% { background-position: 0% 0; }
      }
      @-webkit-keyframes progressGrow {
        0% { width: 5%; }
        15% { width: 40%; }
        35% { width: 65%; }
        55% { width: 80%; }
        75% { width: 90%; }
        100% { width: 97%; }
      }
      @keyframes progressGrow {
        0% { width: 5%; }
        15% { width: 40%; }
        35% { width: 65%; }
        55% { width: 80%; }
        75% { width: 90%; }
        100% { width: 97%; }
      }
      .progress-text {
        font: 10px 'Courier New', monospace;

        -webkit-animation: blink 1s step-end infinite;
        animation: blink 1s step-end infinite;
      }
      @-webkit-keyframes blink { 50% { opacity: 0.5; } }
      @keyframes blink { 50% { opacity: 0.5; } }
      /* CSS counter animation for percentage text */
      @-webkit-keyframes countUp {
        0% { --pct: 5; }
        30% { --pct: 40; }
        60% { --pct: 70; }
        80% { --pct: 85; }
        100% { --pct: 95; }
      }
      @keyframes countUp {
        0% { --pct: 5; }
        30% { --pct: 40; }
        60% { --pct: 70; }
        80% { --pct: 85; }
        100% { --pct: 95; }

      /* iOS Safari specific fixes - prevent animation stalling */
      @supports (-webkit-touch-callout: none) {

          animation: rotateCube 1.2s linear infinite !important;

      }

    <script>
      (function () {
        let started = false;

        const start = () => {
          if (started) return;
          started = true;

          let removed = false;
          const bar = document.getElementById('progress-bar');
          const pct = document.getElementById('progress-pct');
          const startTime = performance.now();

          const removeSpinner = () => {
            if (removed) return;
            removed = true;
            if (bar) bar.style.width = '100%';
            if (pct) pct.textContent = '100%';
            const spinner = document.querySelector('.loading-spinner');
            if (spinner) {
              spinner.classList.add('fade-out');
              setTimeout(() => spinner.remove(), 300);
            }
          };

          // Remove cube only when React has mounted visible route UI.
          // Suspense fallback is null, so #root stays empty while lazy chunks boot.
          const hasVisibleContent = () => {
            const root = document.getElementById('root');
            if (!root) return false;
            if (!root.children.length) return false;
            var rect = root.getBoundingClientRect();
            var text = (root.textContent || '').replace(/\s+/g, ' ').trim();
            var hasPageSignal = !!root.querySelector('header, main, nav, section, article, h1, h2, button, a, input');
            return rect.height > 180 && text.length > 40 && hasPageSignal;
          };

          // RAF-based percentage counter (syncs with 8s CSS progressGrow timing)
          const updatePct = () => {
            if (removed) return;
            var elapsed = performance.now() - startTime;
            var duration = 8000;
            var t = Math.min(elapsed / duration, 1);
            var p;
            if (t < 0.15) p = 5 + (35 * (t / 0.15));
            else if (t < 0.35) p = 40 + (25 * ((t - 0.15) / 0.20));
            else if (t < 0.55) p = 65 + (15 * ((t - 0.35) / 0.20));
            else if (t < 0.75) p = 80 + (10 * ((t - 0.55) / 0.20));
            else p = 90 + (7 * ((t - 0.75) / 0.25));
            if (pct) pct.textContent = Math.round(p) + '%';
            requestAnimationFrame(updatePct);
          };
          requestAnimationFrame(updatePct);

          window.addEventListener('aiwt:route-ready', function() {
            requestAnimationFrame(function() {
              requestAnimationFrame(removeSpinner);
            });
          });

          // Poll for real content. Cheap on CPU (every 100ms) and stops as soon as found.
          var contentCheck = setInterval(function() {
            if (hasVisibleContent()) {
              clearInterval(contentCheck);
              removeSpinner();
            }
          }, 100);

          // Do NOT force-remove the cube on a timer. If React chunks are slow,
          // the loader must keep spinning instead of revealing a black screen.
          setTimeout(function() {
            if (!removed) {
              var root = document.getElementById('root');
              var rootText = root ? (root.textContent || '').replace(/\s+/g, ' ').trim() : '';
              if (root && root.children.length && rootText.length > 40) {
                removeSpinner();
                return;
              }
              var tagline = document.querySelector('.tagline');
              if (tagline) tagline.textContent = 'STILL BOOTING THE MATRIX...';
              if (pct) pct.textContent = '97%';
            }
          }, 15000);
        };

        const tryStart = () => {
          if (started) return;
          if (document.getElementById('progress-bar') && document.getElementById('progress-pct')) {
            start();
            return;
          }
          requestAnimationFrame(tryStart);
        };

        tryStart();
      })();
    </script>
